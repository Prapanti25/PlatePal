spring.application.name=platepal-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/platepal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:platepal}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:platepal_dev_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
openai.api-key=${OPENAI_API_KEY:}
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:PlatePal}
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
